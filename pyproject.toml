[project]
name = "el-punto"
version = "0.1.0"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "celery[redis]",
    "django==6.1.3",
    "django-environ==0.14.0",
    "django-redis",
    "djangorestframework==3.18.3",
    "django-session-timeout==0.1.0",
    "django-filter==26.2",
    "django-solo==2.6.0",
    "django-safedelete==1.5.0",
    "django-extensions==4.1",
    "django-oauth-toolkit",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.10.1",
    "drf-orjson-renderer==1.8.0",
    "django-debug-toolbar==4.4.6",
    "faker==40.44.0",
    "freezegun",
    "model-bakery",
    "pillow==13.0.0",
    "psycopg2-binary",
    "pytest-django",
    "redis",
    "ruff",
    "sentry-sdk[django]",
    "setuptools",
    "termcolor==3.3.0",
    "wheel",
]

[project.optional-dependencies]
deploy = [
    "gunicorn",
]

[tool.uv]
package = false
